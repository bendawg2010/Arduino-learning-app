<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ArduinoLearn — Interactive Arduino Coding</title>

  <!-- ── PWA / iOS Meta Tags ──────────────────────────── -->
  <meta name="application-name" content="ArduinoLearn" />
  <meta name="description" content="Step-by-step interactive Arduino coding lessons with a live simulator." />
  <meta name="theme-color" content="#1f6feb" />

  <!-- iOS Safari "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arduino" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Achievement toast -->
  <div id="achievement-toast" class="achievement-toast hidden">
    <div class="ach-toast-icon" id="ach-toast-icon">🏆</div>
    <div class="ach-toast-body">
      <div class="ach-toast-label">Achievement Unlocked!</div>
      <div class="ach-toast-name" id="ach-toast-name"></div>
    </div>
  </div>

  <!-- Level-up toast -->
  <div id="levelup-toast" class="levelup-toast hidden">
    <div class="lvl-bolt">⚡</div>
    <div>
      <div class="lvl-title">LEVEL UP!</div>
      <div class="lvl-sub" id="lvl-sub">Level 2 Arduino Tinkerer</div>
    </div>
  </div>

  <div id="app">
    <!-- ── Header ────────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <button class="ham-btn" id="ham-btn" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <div class="logo">
          <img src="icons/behs-logo.png" alt="BEHS" class="logo-img"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <span class="logo-fallback" style="display:none;align-items:center;gap:6px">
            <span class="logo-bolt">⚡</span>
            <span class="logo-text">Arduino<strong>Learn</strong></span>
          </span>
        </div>
      </div>

      <div class="header-center">
        <div class="xp-wrap">
          <div class="level-chip" id="level-chip">Lv 1</div>
          <div class="xp-track">
            <div class="xp-fill" id="xp-fill" style="width:0%"></div>
          </div>
          <div class="xp-label" id="xp-label">0 / 100 XP</div>
        </div>
      </div>

      <div class="header-right">
        <button class="icon-btn" data-screen="achievements" title="Achievements">🏆</button>
        <button class="icon-btn" id="reset-btn" title="Reset Progress">↺</button>
      </div>
    </header>

    <div class="layout">
      <!-- ── Sidebar (desktop) ─────────────────────── -->
      <nav class="sidebar" id="sidebar">
        <div class="nav-item nav-home active" data-screen="home">
          <span>🏠</span> Dashboard
        </div>

        <div class="nav-group-label">Beginner</div>
        <div id="nav-beginner" class="nav-group"></div>

        <div class="nav-group-label">Intermediate</div>
        <div id="nav-intermediate" class="nav-group"></div>

        <div class="nav-group-label">Advanced</div>
        <div id="nav-advanced" class="nav-group"></div>

        <div class="nav-divider"></div>

        <div class="nav-item" data-screen="playground">
          <span>🧪</span> Playground
        </div>
        <div class="nav-item" data-screen="projects">
          <span>🔧</span> Projects
        </div>
        <div class="nav-item" data-screen="reference">
          <span>📚</span> Reference
        </div>
        <div class="nav-item" data-screen="achievements">
          <span>🏆</span> Achievements
        </div>
      </nav>

      <!-- ── Main content ─────────────────────────── -->
      <main class="content" id="content"></main>
    </div>

    <!-- ── Mobile Bottom Tab Bar (iPhone) ──────────── -->
    <nav class="mobile-tab-bar" id="mobile-tabs" aria-label="Main navigation">
      <button class="tab-item active" data-tab="home" onclick="navigate('home')">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">Home</span>
      </button>
      <button class="tab-item" data-tab="lesson-picker" id="tab-lessons" onclick="showLessonPicker()">
        <span class="tab-icon">📚</span>
        <span class="tab-label">Lessons</span>
      </button>
      <button class="tab-item" data-tab="playground" onclick="navigate('playground')">
        <span class="tab-icon">🧪</span>
        <span class="tab-label">Play</span>
      </button>
      <button class="tab-item" data-tab="reference" onclick="navigate('reference')">
        <span class="tab-icon">📖</span>
        <span class="tab-label">Ref</span>
      </button>
      <button class="tab-item" data-tab="achievements" onclick="navigate('achievements')">
        <span class="tab-icon">🏆</span>
        <span class="tab-label">Awards</span>
      </button>
    </nav>
  </div>

  <!-- ── Modal ──────────────────────────────────────── -->
  <div id="modal-bg" class="modal-bg hidden">
    <div class="modal" id="modal">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-x">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <!-- ── Scripts ────────────────────────────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/app.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
